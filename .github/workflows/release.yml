name: release

# 推送 v* 标签即自动构建并发布：
#   git tag -a v0.3.22-fix10 -m "..." && git push origin v0.3.22-fix10
# 也支持在 Actions 页面手动指定一个已存在的标签。
#
# 与上游 release.yml 的差异：
#   - 标签允许 <上游版本>-fix<N> 后缀（本 fork 的版本格式）
#   - 不构建 / 推送 Docker Hub 镜像（私有 fork 不发布公共镜像）
#   - 不触发 demo 部署

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的标签，例如 v0.3.22-fix10"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 接受 0.3.22 与 0.3.22-fixN 两种形式（标签带 v 前缀）。
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-fix(0|[1-9][0-9]*))?$ ]]; then
            echo "标签必须形如 v0.3.22 或 v0.3.22-fix7，收到：$RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Pin release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ① 前端静态导出（一次），产物给各平台复用
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压二进制在部分内核/虚拟化/安全策略下会崩溃，默认不启用。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          version="${{ needs.prepare.outputs.version }}"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "artex-${version}-${target}.zip" || { echo "缺少 artex-${version}-${target}.zip" >&2; exit 1; }
          done
          sha256sum *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Replace release only when the tag moved to a new commit
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/rel.json 2>/tmp/rel.err; then
            draft=$(jq -r .isDraft /tmp/rel.json)
            target=$(jq -r '.targetCommitish // empty' /tmp/rel.json)
            if [[ "$draft" != "true" ]]; then
              if [[ "$target" == "$RELEASE_COMMIT" ]]; then
                echo "该版本已发布且已指向当前提交，拒绝重复发布" >&2
                exit 1
              fi
              echo "标签已移动到新提交，删除旧 Release 后重新创建 $RELEASE_TAG"
              gh release delete "$RELEASE_TAG" --yes
            fi
          elif ! grep -qi 'release not found\|HTTP 404' /tmp/rel.err; then
            cat /tmp/rel.err >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            基于上游 ARTEX **v0.3.22** 的本地修订（`local` 分支）。

            > 面向**海外正规授权的 SRC 漏洞挖掘**：
            > [HackerOne](https://www.hackerone.com/) · [Intigriti](https://www.intigriti.com/) · [Bugcrowd](https://www.bugcrowd.com/)

            程序包提供 Linux / macOS 的 AMD64、ARM64 与 Windows AMD64，并附 `SHA256SUMS`。
            部署与在线更新说明见仓库 `README.md` 与 `docs/USAGE.md`。
      - name: Publish complete release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
