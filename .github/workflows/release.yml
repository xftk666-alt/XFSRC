name: release

# 推送 v* 标签即自动构建并发布：
#   git tag -a v0.3.22-fix10 -m "..." && git push origin v0.3.22-fix10
# 也支持在 Actions 页面手动指定一个已存在的标签。
#
# 与上游 release.yml 的差异：
#   - 标签允许 <上游版本>-fix<N> 后缀（本 fork 的版本格式）
#   - 不构建 / 推送 Docker Hub 镜像（私有 fork 不发布公共镜像）
#   - 不触发 demo 部署

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的标签，例如 v0.3.22-fix10"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 接受 0.3.22 与 0.3.22-fixN 两种形式（标签带 v 前缀）。
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-fix(0|[1-9][0-9]*))?$ ]]; then
            echo "标签必须形如 v0.3.22 或 v0.3.22-fix7，收到：$RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          # Upstream base version: 0.3.23-fix1 -> 0.3.23. Used in the release body
          # so it never claims to be "based on" its own fork version.
          echo "base=${RELEASE_TAG#v}" | sed -E 's/-fix[0-9]+$//' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Pin release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse to release a commit that is not on local
        # 标签可能打在任意提交上：只有位于 local 分支历史里的提交才是被审过的代码。
        run: |
          git fetch --no-tags --depth=1 origin local
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "标签提交不在 origin/local 历史中，拒绝发布：$(git rev-parse --short HEAD)" >&2
            exit 1
          fi

  # ① 前端静态导出（一次），产物给各平台复用
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  # 发版前必须跑一遍与 CI 相同的测试：标签推送不会触发 ci.yml，
  # 没有这道门就等于允许用从未通过 go vet / go test 的提交发版。
  test:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ARTEX_PG_DSN: postgres://artex:artex@127.0.0.1:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -p 1 -count=1 ./...

  binaries:
    needs: [prepare, frontend, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压二进制在部分内核/虚拟化/安全策略下会崩溃，默认不启用。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # 发布说明从 CHANGELOG.md 截取，所以这个 job 必须拿到工作区；
      # 之前这里没有 checkout，release #14 的 awk 直接 "cannot open CHANGELOG.md"。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          version="${{ needs.prepare.outputs.version }}"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "artex-${version}-${target}.zip" || { echo "缺少 artex-${version}-${target}.zip" >&2; exit 1; }
          done
          sha256sum *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Compose release notes from CHANGELOG.md
        # The body must say what actually changed. CHANGELOG.md is the source of
        # truth (it is written with the fix); fall back to a stub only when the
        # section is missing, and say so explicitly instead of pretending.
        run: |
          version="${{ needs.prepare.outputs.version }}"
          awk -v want="## v${version}" '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## / { exit }   # 下一个版本章节（含旧格式 ## [0.3.18]）
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::CHANGELOG.md 中没有 v${version} 章节，发布说明将只包含变更链接"
            printf '> ⚠️ 本次发布未在 CHANGELOG.md 中找到 `v%s` 章节，请补充后再编辑 Release。\n\n' "$version" > /tmp/notes.md
          else
            # The extracted section is the WHOLE release note for this version, so it
            # must be self-contained. A "见下节" / "见上一节" pointer is a dangling
            # reference: the reader has no way to follow it from the Release page.
            # (v0.3.23-fix3 shipped this way and its auto-generated note described
            # only the Windows build fix, not the 74 security fixes it delivered.)
            if grep -qE '见下节|见上一节|see below|see above|详见下' /tmp/notes.md; then
              echo "::error::CHANGELOG 的 v${version} 章节含有指向别节的引用（见下节/见上一节）。发布说明只截取本节，引用会失效——请把被引用的内容并入本节。"
              exit 1
            fi
            # A note that only says "nothing changed except X" is not a release note.
            lines=$(grep -c '[^[:space:]]' /tmp/notes.md || true)
            if [ "$lines" -lt 10 ]; then
              echo "::error::CHANGELOG 的 v${version} 章节只有 ${lines} 行非空内容，太短，无法说明本版改了什么。"
              exit 1
            fi
          fi
          {
            echo "基于上游 ARTEX **${{ needs.prepare.outputs.base }}** 的本地修订（\`local\` 分支）。"
            echo
            echo "> 面向**海外正规授权的 SRC 漏洞挖掘**："
            echo "> [HackerOne](https://www.hackerone.com/) · [Intigriti](https://www.intigriti.com/) · [Bugcrowd](https://www.bugcrowd.com/)"
            echo
            cat /tmp/notes.md
            echo
            echo "---"
            echo
            echo "程序包提供 Linux / macOS 的 AMD64、ARM64 与 Windows AMD64，并附 \`SHA256SUMS\`。"
            echo "部署与在线更新说明见仓库 \`README.md\` 与 \`docs/USAGE.md\`。"
          } > /tmp/release-body.md
          echo "release body 长度: $(wc -c < /tmp/release-body.md) 字节"

      - name: Replace release only when the tag moved to a new commit
        id: existing
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          skip=false
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/rel.json 2>/tmp/rel.err; then
            draft=$(jq -r .isDraft /tmp/rel.json)
            target=$(jq -r '.targetCommitish // empty' /tmp/rel.json)
            if [[ "$draft" != "true" ]]; then
              if [[ "$target" == "$RELEASE_COMMIT" ]]; then
                # 同一个提交重复触发（重跑、或标签被删后重推）：已发布的 Release
                # 就是想要的结果。之前这里 exit 1，导致每次重跑都亮红灯。
                echo "::notice::$RELEASE_TAG 已发布且指向 $RELEASE_COMMIT，无需重建"
                skip=true
              else
                echo "标签已移动到新提交，删除旧 Release 后重新创建 $RELEASE_TAG"
                gh release delete "$RELEASE_TAG" --yes
              fi
            fi
          elif ! grep -qi 'release not found\|HTTP 404' /tmp/rel.err; then
            cat /tmp/rel.err >&2
            exit 1
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.existing.outputs.skip != 'true'
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — XFSRC 本地修订"
          target_commitish: ${{ needs.prepare.outputs.commit }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: /tmp/release-body.md
      - name: Publish complete release
        if: steps.existing.outputs.skip != 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
