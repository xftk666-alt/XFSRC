name: xfsrc

services:
  postgres:
    image: postgres:16-alpine
    container_name: xfsrc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - xfsrc
    restart: unless-stopped

  app:
    image: ${XFSRC_IMAGE:-xfsrc}:${XFSRC_TAG:-latest}
    container_name: xfsrc-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_SKILL_DIR: /app/skills
    command: ["-addr", ":8787", "-proxy", ":8788", "-data", "/app/data"]
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ../data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ../skills:/app/skills
      # 守护脚本放到持久卷：容器重建后不会退回镜像里的旧 start.sh。
      # jwt.key 不单独挂载：keyDir 是 /app（可执行文件旁），宿主机文件不存在时
      # Docker 会把绑定挂载源创建成目录，导致首次启动崩溃。改由 start.sh 在
      # 启动前从 /app/data/jwt.key 恢复（没有则生成并写回 data 卷）。
      - ../deploy/start.sh:/app/start.sh:ro
      # 可写挂载的二进制目录：页面「一键更新」替换的是 /app/bin/artex，
      # 落在宿主机 bin/ 下，容器重建后仍然是新版本（镜像内的 /app/artex 仅作兜底）。
      - ../bin:/app/bin
    networks:
      - xfsrc
    restart: unless-stopped

volumes:
  pgdata:
    name: xfsrc_pgdata


networks:
  xfsrc:
    name: xfsrc_default
    ipam:
      config:
        # 固定网段：宿主机转发服务只监听 172.18.0.1:3066，换网段会让容器失去出海口。
        - subnet: 172.18.0.0/16
